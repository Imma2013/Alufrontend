name: Backend E2E

on:
  push:
    branches: [main]
    paths:
      - "alu-backend/**"
      - ".github/workflows/backend-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alu-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: alu-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run live E2E critical paths
        env:
          E2E_REQUIRED: "true"
          E2E_RUN_MUTATING: "true"
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_AUTH_BEARER: ${{ secrets.E2E_AUTH_BEARER }}
          E2E_CLERK_BEARER: ${{ secrets.E2E_CLERK_BEARER }}
          E2E_SHORT_PRICE_ID: ${{ secrets.E2E_SHORT_PRICE_ID }}
          E2E_WEBHOOK_USER_ID: ${{ secrets.E2E_WEBHOOK_USER_ID }}
          E2E_DM_PARTICIPANT_ID: ${{ secrets.E2E_DM_PARTICIPANT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: npm run test:e2e
